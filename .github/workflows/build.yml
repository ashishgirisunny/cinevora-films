name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Build Android App
        run: |
          rm -rf android
          flutter create --platforms=android --org com.cinevora --project-name films .
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="films"#android:label="CineVora Films"#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: cinevora-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
